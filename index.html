<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terremotos en vivo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:system-ui,sans-serif;background:#0f1115;color:#e8e8e8}
  #app{display:flex;height:100%}
  #side{width:340px;max-width:40%;display:flex;flex-direction:column;border-right:1px solid #262a33}
  header{padding:14px 16px;border-bottom:1px solid #262a33}
  h1{font-size:18px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
  .live{width:9px;height:9px;border-radius:50%;background:#ff3b30;animation:blink 1.4s infinite}
  @keyframes blink{50%{opacity:.25}}
  #status{font-size:12px;color:#9aa0ab}
  .controls{display:flex;gap:8px;margin-top:10px}
  select{flex:1;background:#1a1d24;color:#e8e8e8;border:1px solid #333845;border-radius:6px;padding:6px}
  #list{flex:1;overflow-y:auto}
  .item{padding:10px 16px;border-bottom:1px solid #1d2028;cursor:pointer;display:flex;gap:12px;align-items:center}
  .item:hover{background:#1a1d24}
  .mag{min-width:46px;text-align:center;font-weight:700;font-size:16px;color:#fff;background:#c0281f;border-radius:6px;padding:5px 0}
  .info{font-size:13px;line-height:1.35}
  .info small{color:#9aa0ab}
  #map{flex:1;background:#0f1115}
  .warn{font-size:11px;color:#9aa0ab;padding:10px 16px;border-top:1px solid #262a33}
  path.pulse{animation:pulse 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{0%{transform:scale(1);fill-opacity:.8}100%{transform:scale(2.2);fill-opacity:0}}
  @media(max-width:700px){#app{flex-direction:column-reverse}#side{width:100%;max-width:none;height:40%}}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <header>
      <h1><span class="live"></span> Terremotos en vivo</h1>
      <div id="status">Cargando…</div>
      <div class="controls">
        <select id="feed">
          <option value="all_hour">Última hora</option>
          <option value="all_day" selected>Últimas 24 h</option>
          <option value="2.5_week">Semana (M2.5+)</option>
          <option value="4.5_week">Semana (M4.5+)</option>
        </select>
      </div>
    </header>
    <div id="list"></div>
    <div class="warn">⚠️ Solo informativo. No es un sistema de alerta temprana: sigue siempre los canales oficiales de tu país. Datos: USGS.</div>
  </aside>
  <div id="map"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const map = L.map('map',{worldCopyJump:true}).setView([15,-30],2);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',{
  attribution:'Tiles © Esri',maxZoom:16,minZoom:2}).addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}',{
  maxZoom:16,minZoom:2}).addTo(map);

const layer = L.layerGroup().addTo(map);
const markers = {};
const seen = new Set();
let first = true;

const ago = t => {
  const m = Math.round((Date.now()-t)/60000);
  if (m < 1) return 'hace instantes';
  if (m < 60) return `hace ${m} min`;
  const h = Math.floor(m/60);
  return h < 24 ? `hace ${h} h ${m%60} min` : `hace ${Math.floor(h/24)} d`;
};

async function load(){
  const feed = document.getElementById('feed').value;
  const status = document.getElementById('status');
  try{
    const r = await fetch(`https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/${feed}.geojson`);
    if(!r.ok) throw new Error(r.status);
    const data = await r.json();
    const feats = data.features.filter(f=>f.properties.mag!==null)
                               .sort((a,b)=>b.properties.time-a.properties.time);
    layer.clearLayers();
    const list = document.getElementById('list');
    list.innerHTML = '';
    feats.forEach(f=>{
      const p=f.properties, [lon,lat,depth]=f.geometry.coordinates;
      const recent = Date.now()-p.time < 3600000;
      const m = L.circleMarker([lat,lon],{
        radius:Math.max(3,p.mag*2.6),color:'#ff3b30',weight:1,
        fillColor:'#ff3b30',fillOpacity:.65,className:recent?'pulse':''
      }).addTo(layer);
      m.bindPopup(`<b>M ${p.mag.toFixed(1)}</b><br>${p.place}<br>
        Prof.: ${depth.toFixed(0)} km<br>${new Date(p.time).toLocaleString()}<br>
        Coord.: ${lat.toFixed(2)}, ${lon.toFixed(2)}<br>
        <a href="${p.url}" target="_blank" rel="noopener">Más info</a>`);
      markers[f.id]=m;
      const el = document.createElement('div');
      el.className='item';
      el.innerHTML=`<div class="mag">${p.mag.toFixed(1)}</div>
        <div class="info">${p.place}<br><small>${ago(p.time)} · ${depth.toFixed(0)} km</small></div>`;
      el.onclick=()=>{map.flyTo([lat,lon],5);m.openPopup();};
      list.appendChild(el);
      if(!first && !seen.has(f.id) && p.mag>=4.5) m.openPopup();
      seen.add(f.id);
    });
    first=false;
    status.textContent=`${feats.length} sismos · actualizado ${new Date().toLocaleTimeString()}`;
  }catch(e){
    status.textContent='Error al cargar datos. Reintentando…';
  }
}
document.getElementById('feed').onchange=()=>{first=true;seen.clear();load();};
load();
setInterval(load,60000);
</script>
</body>
</html>
